apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # php-app's ServiceMonitor/PrometheusRule need the monitoring.coreos.com
  # CRDs that kube-prometheus-stack installs, so apps waits for infra.
  dependsOn:
    - name: infrastructure
