# CI tags as main-<short-sha>-<pipeline-iid>; `latest` or a bare SHA would
# not sort, so the numeric pipeline IID is extracted and compared.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: php-app-nginx
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: php-app-nginx
  filterTags:
    pattern: '^main-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: "$ts"
  policy:
    numerical:
      order: asc
