server {
    listen 8080;
    server_name _;

    root /var/www/html;
    index index.php;

    # Scraped by the nginx-prometheus-exporter sidecar, not exposed on the
    # app Service.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
