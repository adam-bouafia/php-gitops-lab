[www]
user = www-data
group = www-data

listen = 9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; Status page scraped by the php-fpm_exporter sidecar over the loopback
; interface (same pod, shared network namespace with nginx).
pm.status_path = /fpm-status

clear_env = no
